# scripts/openocd.cfg
#
# Конфигурация OpenOCD для ST-Link v2 и STM32F103.
#
# Использование:
#   openocd -f scripts/openocd.cfg
#   (GDB подключается к localhost:3333, см. scripts/gdb_debug.gdb)
#
# ВАЖНО: для ST-Link НЕ выбираем "transport select swd" вручную —
# используется hla_swd, который выбирается автоматически. Попытка
# переключить транспорт после инициализации вызывает ошибку
# "Can't change session's transport after the initial selection was made".

source [find interface/stlink.cfg]
source [find target/stm32f1x.cfg]