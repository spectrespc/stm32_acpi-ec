# scripts/openocd_c0.cfg
#
# OpenOCD (git master) для ST-Link и STM32C031.
# OpenOCD 0.12 из Debian STM32C0 не поддерживает: нужен master, где есть
# tcl/target/stm32c0x.cfg и драйвер flash stm32l4x.
#
# Использование:
#   openocd -s <prefix>/share/openocd/scripts -f scripts/openocd_c0.cfg
#   (GDB подключается к localhost:3333)
#
# ВАЖНО: для ST-Link выбран SWD (dapdirect), а не устаревший hla_swd.
# Это требует прошивки ST-Link не старше ~2.37.

source [find interface/stlink.cfg]
transport select swd
source [find target/stm32c0x.cfg]

adapter speed 1000